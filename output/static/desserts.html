<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desserts - Gourmet Delight</title>
        <link rel="stylesheet" href="css/restraunt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigation (same as index.html) -->
    
    <!-- Desserts Hero Section -->
    <section class="menu-hero" id="desserts-hero">
        <div class="container">
            <h1>Our Desserts</h1>
            <p>Sweet endings to complete your meal</p>
        </div>
    </section>

    <!-- Desserts Menu Section -->
    <section class="menu-category-page">
        <div class="container">
            <div class="menu-items">
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1563805042-7684c019e1cb?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Tiramisu">
                    </div>
                    <div class="item-info">
                        <h3>Tiramisu</h3>
                        <p>Classic Italian dessert with layers of coffee-soaked ladyfingers and mascarpone cream</p>
                        <div class="item-price">$8.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- More dessert items -->
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1571115177098-24ec42ed204d?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Chocolate Lava Cake">
                    </div>
                    <div class="item-info">
                        <h3>Chocolate Lava Cake</h3>
                        <p>Warm chocolate cake with a molten center, served with vanilla ice cream</p>
                        <div class="item-price">$9.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- Add more desserts as needed -->
            </div>
        </div>
    </section>

    <!-- Footer (same as index.html) -->
    
    <script src="script.js"></script>
</body>
</html>
