<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Courses - Gourmet Delight</title>
    <link rel="stylesheet" href="css/restraunt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigation (same as index.html) -->
    
    <!-- Main Courses Hero Section -->
    <section class="menu-hero" id="mains-hero">
        <div class="container">
            <h1>Main Courses</h1>
            <p>Hearty dishes to satisfy your appetite</p>
        </div>
    </section>

    <!-- Main Courses Menu Section -->
    <section class="menu-category-page">
        <div class="container">
            <div class="menu-items">
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Filet Mignon">
                    </div>
                    <div class="item-info">
                        <h3>Filet Mignon</h3>
                        <p>8oz tender beef filet with roasted potatoes and seasonal vegetables</p>
                        <div class="item-price">$32.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- More main course items -->
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Grilled Salmon">
                    </div>
                    <div class="item-info">
                        <h3>Grilled Salmon</h3>
                        <p>Fresh Atlantic salmon with lemon butter sauce and asparagus</p>
                        <div class="item-price">$26.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- Add more main courses as needed -->
            </div>
        </div>
    </section>

    <!-- Footer (same as index.html) -->
    
    <script src="script.js"></script>
