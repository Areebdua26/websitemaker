<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks - Gourmet Delight</title>
    <link rel="stylesheet" href="css/restraunt.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Navigation (same as index.html) -->
    
    <!-- Drinks Hero Section -->
    <section class="menu-hero" id="drinks-hero">
        <div class="container">
            <h1>Our Drinks</h1>
            <p>Refreshing beverages to complement your meal</p>
        </div>
    </section>

    <!-- Drinks Menu Section -->
    <section class="menu-category-page">
        <div class="container">
            <div class="menu-items">
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="House Red Wine">
                    </div>
                    <div class="item-info">
                        <h3>House Red Wine</h3>
                        <p>Glass of our signature Cabernet Sauvignon</p>
                        <div class="item-price">$9.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- More drink items -->
                <div class="menu-item">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Craft Cocktails">
                    </div>
                    <div class="item-info">
                        <h3>Craft Cocktails</h3>
                        <p>Ask your server about our seasonal craft cocktail selection</p>
                        <div class="item-price">$12.99</div>
                        <a href="#" class="btn">Add to Order</a>
                    </div>
                </div>
                
                <!-- Add more drinks as needed -->
            </div>
        </div>
    </section>

    <!-- Footer (same as index.html) -->
    
    <script src="script.js"></script>
</body>
</html>
